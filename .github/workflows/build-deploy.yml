name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apphost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build AppHost
        run: dotnet build MattKotsenas.slnx --configuration Release

      - name: Verify AppHost formatting
        run: >-
          dotnet format MattKotsenas.slnx
          --no-restore
          --verify-no-changes

      - name: Check AppHost changes
        run: dotnet slopwatch analyze --fail-on warning

      - name: Test AppHost
        run: >-
          dotnet test MattKotsenas.slnx
          --configuration Release
          --no-build
          --no-restore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Hugo Docker image
        run: docker build -t mattkotsenas/blog-hugo -f build/Dockerfile .

      - name: Generate site with Hugo
        run: docker run --rm -v ${{ github.workspace }}:/src mattkotsenas/blog-hugo hugo --minify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://matt.kotsenas.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mattkotsenas
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site/
