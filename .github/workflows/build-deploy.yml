name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apphost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build AppHost
        run: dotnet build MattKotsenas.slnx --configuration Release

      - name: Generate deployment artifacts
        run: >-
          dotnet aspire publish
          --output-path generated/azure
          --environment preview
          --non-interactive

      - name: Verify generated artifacts
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate deployment artifacts
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            az bicep build --file "$file" --stdout > /dev/null
          done < <(find generated/azure -name '*.bicep' -print0)

      - name: Verify AppHost formatting
        run: >-
          dotnet format MattKotsenas.slnx
          --no-restore
          --verify-no-changes

      - name: Test AppHost
        run: >-
          dotnet test MattKotsenas.slnx
          --configuration Release
          --no-build
          --no-restore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate site with Hugo
        run: >-
          docker build
          --target export
          --output type=local,dest=public
          --file build/Dockerfile
          .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/

  deploy-legacy-web-app-until-container-cutover:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://matt.kotsenas.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: mattkotsenas
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site/

  deploy-container-app:
    needs: [apphost, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        env:
          Azure__Location: westus3
          Azure__ResourceGroup: blog
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: dotnet aspire deploy --environment preview --non-interactive
